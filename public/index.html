<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mistral</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/app.js"></script>
  </head>

  <body>
    <a href="#contenu">Aller au contenu</a>

    <main id="contenu">
      <h1>Mistral</h1>

      <ul id="historique" aria-live="polite"></ul>

      <form id="formulaire">
        <label for="message">Votre message :</label>
        <input
          type="text"
          id="message"
          name="message"
          maxlength="130"
        >
        <button id="envoyer" type="submit">Envoyer</button>
      </form>
      <p id="compteur">0 / 130</p>
      <p id="statut" aria-live="polite"></p>
      <button id="effacer" type="button">Effacer l'historique</button>
    </main>
  </body>
</html>
